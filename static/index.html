<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta name="theme-color" content="#0a2a5e">
<title>DRT Fichaje</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a2a5e;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes bk{0%,100%{opacity:1}50%{opacity:.2}}
table{width:100%;border-collapse:collapse;min-width:520px}
th{background:#1a4080;padding:10px 12px;text-align:left;font-size:10px;color:#c8dff5;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #0d3370;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05);color:#fff;font-size:12px}
tr:last-child td{border-bottom:none}tr:hover td{background:rgba(255,255,255,.04)}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px #0d1f4a inset;-webkit-text-fill-color:#fff}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback}=React;

// ── COLORES ───────────────────────────────────────────────────
const BG="#0a2a5e",BG2="#0d3370",CARD="#1a4080",BLUE="#1a6fd4",ACC="#6ec6ff";
const GR="#ffffff",GD="#c8dff5",GDD="#7aaad8",RED="#e03946",GN="#2cb67d",WARN="#f59e0b";
const bB={display:"inline-flex",alignItems:"center",justifyContent:"center",gap:7,padding:"9px 18px",border:"none",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer"};
const INP={width:"100%",background:"#071a3e",border:"1px solid #1a4080",borderRadius:8,padding:"10px 13px",color:"#fff",fontSize:14,outline:"none"};

// ── API ───────────────────────────────────────────────────────
const BASE=window.location.origin;
const getToken=()=>localStorage.getItem("drt_token");
const setToken=t=>localStorage.setItem("drt_token",t);
const clearToken=()=>localStorage.removeItem("drt_token");

async function api(path,opts={}){
  const tk=getToken();
  const headers={"Content-Type":"application/json"};
  if(tk)headers["Authorization"]="Bearer "+tk;
  const res=await fetch(BASE+path,{...opts,headers});
  if(!res.ok){const e=await res.json().catch(()=>({detail:"Error de red"}));throw new Error(e.detail||"Error");}
  return res.json();
}

// ── UTILS ─────────────────────────────────────────────────────
const fT=d=>new Date(d).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});
const fTs=d=>new Date(d).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
const fDate=d=>new Date(d).toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"2-digit"});
const fDT=d=>fDate(d)+" "+fTs(d);
const fD=d=>new Date(d).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const fMs=ms=>Math.floor(ms/3600000)+"h "+Math.floor((ms%3600000)/60000)+"m";
const RET=4;
const canDel=ts=>{const d=new Date(ts);d.setFullYear(d.getFullYear()+RET);return Date.now()>=d;};
const hAgo=(ts,h)=>Date.now()-new Date(ts).getTime()>h*3600000;
const getGPS=()=>new Promise(r=>{
  if(!navigator.geolocation)return r({lat:null,lon:null,acc:null});
  navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy)}),()=>r({lat:null,lon:null,acc:null}),{timeout:6000,enableHighAccuracy:true});
});
function pairFiches(fs){
  const s=fs.slice().sort((a,b)=>a.ts.localeCompare(b.ts));
  const pairs=[];let i=0;
  while(i<s.length){
    if(s[i].tipo==="entrada"){const sal=(i+1<s.length&&s[i+1].tipo==="salida")?s[i+1]:null;pairs.push({ent:s[i],sal});i+=sal?2:1;}
    else{pairs.push({ent:null,sal:s[i]});i++;}
  }
  return pairs;
}
const totalMs=pairs=>pairs.reduce((ms,p)=>{if(p.ent&&p.sal)ms+=new Date(p.sal.ts)-new Date(p.ent.ts);return ms;},0);
const GDPR=`POLÍTICA DE PRIVACIDAD — DRT Fichaje\nResponsable: Durango Rugby Taldea, Durango (Bizkaia).\nDatos tratados: nombre y apellido, email, teléfono, fecha/hora de fichaje, dirección IP pública, coordenadas GPS.\nFinalidad: Control de presencia y jornada laboral obligatorio conforme al art. 34 ET y RDL 8/2019.\nConservación mínima: ${RET} años. Contraseñas: hash SHA-256 (no reversible).\nDerechos: Acceso, rectificación, portabilidad y oposición. Contactar con Durango Rugby Taldea.`;

// ── COMPONENTES BASE ──────────────────────────────────────────
const Sp=({sz=18})=>(<div style={{width:sz,height:sz,borderRadius:"50%",border:"2px solid rgba(255,255,255,.3)",borderTopColor:"white",animation:"sp .7s linear infinite",flexShrink:0}}/>);
const Msg=({t,m})=>m?(<div style={{padding:"11px 14px",borderRadius:8,marginBottom:12,fontSize:13,lineHeight:1.5,background:t==="e"?"rgba(220,57,70,.15)":t==="ok"?"rgba(44,182,125,.15)":t==="w"?"rgba(245,158,11,.15)":"rgba(110,198,255,.15)",border:"1px solid "+(t==="e"?"rgba(220,57,70,.4)":t==="ok"?"rgba(44,182,125,.4)":t==="w"?"rgba(245,158,11,.4)":"rgba(110,198,255,.4)"),color:t==="e"?"#ff8080":t==="ok"?GN:t==="w"?WARN:ACC}}>{m}</div>):null;
const Ir=({k,v})=>(<div style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,.08)"}}><span style={{fontSize:12,color:GD,minWidth:110,flexShrink:0}}>{k}</span><span style={{fontSize:11,color:GR,textAlign:"right",wordBreak:"break-all"}}>{v}</span></div>);

function Logo({h=40}){
  const[err,setErr]=useState(false);
  const hs=typeof h==="number"?h+"px":h;
  if(err)return(<div style={{height:hs,display:"flex",alignItems:"center",gap:8}}><div style={{fontSize:"clamp(18px,4vw,32px)",fontWeight:900,color:ACC,letterSpacing:3}}>DRT</div><div style={{fontSize:"clamp(7px,1.5vw,11px)",color:GD,letterSpacing:2,lineHeight:1.4}}>DURANGO<br/>RUGBY TALDEA</div></div>);
  return(<img src="https://durangorugby.eus/wp-content/uploads/2018/10/DRTLogo.png" alt="DRT" style={{height:hs,objectFit:"contain",maxWidth:"100%"}} onError={()=>setErr(true)}/>);
}

const Tabs=({tabs,cur,set})=>(<div style={{display:"flex",background:BG2,borderBottom:"1px solid #1a4080",overflowX:"auto"}}>{tabs.map(([k,l])=>(<div key={k} onClick={()=>set(k)} style={{padding:"11px 16px",fontSize:13,color:cur===k?ACC:GD,cursor:"pointer",borderBottom:"2px solid "+(cur===k?ACC:"transparent"),whiteSpace:"nowrap",fontWeight:cur===k?600:400}}>{l}</div>))}</div>);

function Hdr({user,onLogout,onAdmin}){
  return(<div style={{background:BG2,borderBottom:"2px solid "+BLUE,padding:"8px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}>
    <Logo h={36}/>
    <div style={{display:"flex",gap:8,alignItems:"center"}}>
      {user.role==="admin"&&onAdmin&&<button onClick={onAdmin} style={{...bB,background:ACC,color:BG,fontSize:12,padding:"6px 14px",fontWeight:700}}>⚙ Admin</button>}
      <span style={{background:CARD,border:"1px solid "+BLUE,borderRadius:20,padding:"4px 12px",fontSize:12,color:GR}}><b>{user.nombre}</b></span>
      <button onClick={onLogout} style={{...bB,background:"transparent",color:GD,border:"1px solid #1a4080",fontSize:11,padding:"5px 10px"}}>Salir</button>
    </div>
  </div>);
}

// ── SETUP ─────────────────────────────────────────────────────
function Setup({onDone}){
  const[f,setF]=useState({nombre:"",apellido:"",pwd:"",dept:"Dirección",email:""});
  const[err,setErr]=useState("");const[ld,setLd]=useState(false);
  const set=k=>e=>setF(x=>({...x,[k]:e.target.value}));
  async function go(){
    if(!f.nombre.trim()||!f.apellido.trim()||!f.pwd)return setErr("Nombre, apellido y contraseña obligatorios");
    if(f.pwd.length<6)return setErr("Contraseña mínimo 6 caracteres");
    setLd(true);setErr("");
    try{const r=await api("/api/setup",{method:"POST",body:JSON.stringify({nombre:f.nombre.trim(),apellido:f.apellido.trim(),email:f.email,dept:f.dept,pwd:f.pwd})});setToken(r.token);onDone(r.user);}
    catch(e){setErr(e.message);}finally{setLd(false);}
  }
  const I=(k,l,t,ac)=>(<div style={{marginBottom:14}}><label style={{display:"block",fontSize:12,color:GD,marginBottom:6}}>{l}</label><input type={t||"text"} value={f[k]} placeholder={l} autoCapitalize={ac||"words"} onChange={set(k)} onKeyDown={e=>e.key==="Enter"&&go()} style={INP}/></div>);
  return(<div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,gap:24}}>
    <Logo h="18vh"/>
    <div style={{width:"100%",maxWidth:460,background:BG2,border:"1px solid #1a4080",borderRadius:16,padding:28}}>
      <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>Primera configuración</div>
      <div style={{fontSize:12,color:GD,marginBottom:18}}>Crea la cuenta de administrador</div>
      <Msg t="e" m={err}/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{I("nombre","Nombre *")}{I("apellido","Apellido *")}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{I("dept","Departamento")}{I("email","Email","email","none")}</div>
      {I("pwd","Contraseña (mín. 6 caracteres)","password","none")}
      <button disabled={ld} onClick={go} style={{...bB,background:BLUE,color:"#fff",width:"100%",height:46,opacity:ld?.6:1}}>{ld?<Sp/>:"Crear administrador"}</button>
    </div>
  </div>);
}

// ── LOGIN ─────────────────────────────────────────────────────
function Login({onLogin,err,ld}){
  const[name,setName]=useState("");const[pwd,setPwd]=useState("");
  const go=()=>onLogin(name,pwd);
  return(<div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,gap:24}}>
    <Logo h="18vh"/>
    <div style={{width:"100%",maxWidth:400,background:BG2,border:"1px solid #1a4080",borderRadius:16,padding:28}}>
      <Msg t="e" m={err}/>
      <div style={{marginBottom:14}}><label style={{display:"block",fontSize:12,color:GD,marginBottom:6}}>Nombre y apellido</label>
        <input value={name} placeholder="Ej: Mikel García" autoCapitalize="words" onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} style={INP}/></div>
      <div style={{marginBottom:18}}><label style={{display:"block",fontSize:12,color:GD,marginBottom:6}}>Contraseña</label>
        <input type="password" value={pwd} placeholder="••••••••" onChange={e=>setPwd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} style={INP}/></div>
      <button disabled={ld} onClick={go} style={{...bB,background:BLUE,color:"#fff",width:"100%",height:48,fontSize:15,opacity:ld?.6:1}}>{ld?<Sp/>:"Acceder"}</button>
    </div>
  </div>);
}

// ── FIRST PWD ─────────────────────────────────────────────────
function FirstPwd({user,onDone}){
  const[step,setStep]=useState("gdpr");
  const[ok,setOk]=useState(false);const[pwd,setPwd]=useState("");const[pwd2,setPwd2]=useState("");
  const[err,setErr]=useState("");const[ld,setLd]=useState(false);
  async function guardar(){
    if(!pwd)return setErr("Introduce tu nueva contraseña");
    if(pwd.length<6)return setErr("Mínimo 6 caracteres");
    if(pwd!==pwd2)return setErr("Las contraseñas no coinciden");
    setLd(true);
    try{await api("/api/auth/change-password",{method:"POST",body:JSON.stringify({new_pwd:pwd})});onDone();}
    catch(e){setErr(e.message);}finally{setLd(false);}
  }
  if(step==="gdpr")return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,gap:20}}>
      <Logo h="15vh"/>
      <div style={{width:"100%",maxWidth:520,background:BG2,border:"1px solid #1a4080",borderRadius:16,padding:28}}>
        <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>Bienvenid@, {user.nombre}</div>
        <div style={{fontSize:12,color:GD,marginBottom:16}}>Lee y acepta la política de privacidad antes de continuar</div>
        <div style={{fontSize:11,color:GD,lineHeight:1.8,background:"#071a3e",padding:14,borderRadius:8,border:"1px solid #1a4080",maxHeight:200,overflowY:"auto",marginBottom:14,whiteSpace:"pre-wrap"}}>{GDPR}</div>
        <label style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",marginBottom:18}}>
          <input type="checkbox" checked={ok} onChange={e=>setOk(e.target.checked)} style={{marginTop:3,accentColor:ACC,width:16,height:16}}/>
          <span style={{fontSize:13,color:GD}}>He leído y acepto la política de privacidad (RGPD).</span>
        </label>
        <button disabled={!ok} onClick={()=>setStep("pwd")} style={{...bB,background:BLUE,color:"#fff",width:"100%",height:46,opacity:ok?1:.4}}>Aceptar y continuar</button>
      </div>
    </div>);
  return(
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,gap:20}}>
      <Logo h="15vh"/>
      <div style={{width:"100%",maxWidth:400,background:BG2,border:"1px solid #1a4080",borderRadius:16,padding:28}}>
        <div style={{fontSize:18,fontWeight:700,marginBottom:4}}>Crea tu contraseña</div>
        <div style={{fontSize:12,color:GD,marginBottom:18}}>Elige tu contraseña personal.</div>
        <Msg t="e" m={err}/>
        <div style={{marginBottom:14}}><label style={{display:"block",fontSize:12,color:GD,marginBottom:6}}>Nueva contraseña (mín. 6 caracteres)</label>
          <input type="password" value={pwd} placeholder="••••••••" onChange={e=>setPwd(e.target.value)} style={INP}/></div>
        <div style={{marginBottom:18}}><label style={{display:"block",fontSize:12,color:GD,marginBottom:6}}>Confirmar contraseña</label>
          <input type="password" value={pwd2} placeholder="••••••••" onChange={e=>setPwd2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&guardar()} style={INP}/></div>
        <button disabled={ld} onClick={guardar} style={{...bB,background:BLUE,color:"#fff",width:"100%",height:46,opacity:ld?.6:1}}>{ld?<Sp/>:"Guardar mi contraseña"}</button>
      </div>
    </div>);
}

// ── FICHAR TAB ────────────────────────────────────────────────
function FicharTab({user,now,fichajes,onRefresh}){
  const[ld,setLd]=useState(false);const[msg,setMsg]=useState(null);
  const last=fichajes.length?fichajes[fichajes.length-1]:null;
  const isIn=last?last.tipo==="entrada":false;
  const today=new Date().toISOString().slice(0,10);
  const todayPairs=pairFiches(fichajes.filter(f=>f.ts.startsWith(today)));
  async function fichar(){
    if(!isIn&&todayPairs.length>=3)return setMsg({t:"w",m:"⚠️ Ya tienes 3 jornadas registradas hoy."});
    setLd(true);setMsg(null);
    const gps=await getGPS();
    try{const r=await api("/api/fichar",{method:"POST",body:JSON.stringify({lat:gps.lat,lon:gps.lon,acc:gps.acc})});
      setMsg({t:"ok",m:"✅ "+r.tipo.charAt(0).toUpperCase()+r.tipo.slice(1)+" registrada — "+fT(new Date())});onRefresh();}
    catch(e){setMsg({t:"e",m:e.message});}finally{setLd(false);}
  }
  return(<>
    {isIn&&last&&hAgo(last.ts,10)&&<Msg t="w" m="⚠️ Llevas más de 10 horas en jornada. ¿Olvidaste fichar salida?"/>}
    <div style={{textAlign:"center",padding:"20px 0 10px"}}>
      <div style={{fontSize:52,fontWeight:200,fontFamily:"monospace",letterSpacing:-2}}>{fTs(now)}</div>
      <div style={{fontSize:13,color:GD,marginTop:3,textTransform:"capitalize"}}>{fD(now)}</div>
      <div style={{marginTop:10,display:"flex",justifyContent:"center"}}>
        <span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"5px 16px",borderRadius:100,fontSize:11,fontWeight:600,textTransform:"uppercase",background:isIn?"rgba(44,182,125,.15)":"rgba(255,255,255,.08)",color:isIn?GN:GD,border:"1px solid "+(isIn?"rgba(44,182,125,.4)":"#1a4080")}}>
          <span style={{width:7,height:7,borderRadius:"50%",background:"currentColor",animation:isIn?"bk 1.5s infinite":"none"}}/>{isIn?"EN JORNADA":"FUERA"}
        </span>
      </div>
    </div>
    {msg&&<Msg t={msg.t} m={msg.m}/>}
    <div style={{display:"flex",justifyContent:"center",marginBottom:18}}>
      <button disabled={ld} onClick={fichar} style={{...bB,background:isIn?RED:GN,color:"#fff",height:80,fontSize:18,fontWeight:700,borderRadius:14,width:"100%",maxWidth:320,opacity:ld?.6:1}}>
        {ld?<Sp sz={28}/>:(<><span style={{fontSize:24}}>{isIn?"■":"▶"}</span><div><div>{isIn?"FICHAR SALIDA":"FICHAR ENTRADA"}</div><div style={{fontSize:12,fontWeight:400,opacity:.8}}>{isIn?"Registrar fin de jornada":"Registrar inicio de jornada"}</div></div></>)}
      </button>
    </div>
    <div style={{background:BG2,border:"1px solid #1a4080",borderRadius:10,padding:18,marginBottom:14}}>
      <div style={{fontSize:10,fontWeight:700,color:GD,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:12}}>Jornadas hoy {fDate(new Date())}</div>
      {todayPairs.length===0?<div style={{color:GDD,textAlign:"center",padding:"12px 0",fontSize:12}}>Sin jornadas registradas hoy</div>:
        todayPairs.map((p,i)=>{const ms=p.ent&&p.sal?new Date(p.sal.ts)-new Date(p.ent.ts):0;return(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:CARD,borderRadius:8,marginBottom:8,border:"1px solid #1a4080",flexWrap:"wrap"}}>
            <span style={{background:BLUE,color:"#fff",borderRadius:"50%",width:22,height:22,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700}}>{i+1}</span>
            <span style={{fontFamily:"monospace",fontSize:15,fontWeight:600,color:GN}}>{p.ent?fT(p.ent.ts):"—"}</span>
            <span style={{color:GD,fontSize:12}}>entrada</span><span style={{color:GD,fontSize:18}}>→</span>
            {p.sal?(<><span style={{fontFamily:"monospace",fontSize:15,fontWeight:600,color:RED}}>{fT(p.sal.ts)}</span><span style={{color:GD,fontSize:12}}>salida</span></>):(<><span style={{color:GN,animation:"bk 1.5s infinite"}}>●</span><span style={{fontSize:12,color:GD}}>en curso</span></>)}
            {ms>0&&<span style={{marginLeft:"auto",fontSize:12,color:ACC,fontWeight:600,fontFamily:"monospace"}}>{fMs(ms)}</span>}
          </div>);})}
      <div style={{marginTop:10,fontSize:12,color:GD,textAlign:"right"}}>
        Hoy: <b style={{color:ACC,fontFamily:"monospace"}}>{fMs(totalMs(todayPairs))}</b>{"  ·  "}Total: <b style={{color:GR,fontFamily:"monospace"}}>{fMs(totalMs(pairFiches(fichajes)))}</b>
      </div>
    </div>
  </>);
}

// ── SEMANA TAB ────────────────────────────────────────────────
function SemanaTab({fichajes}){
  const hoy=new Date();const dow=(hoy.getDay()+6)%7;
  const lun=new Date(hoy);lun.setDate(hoy.getDate()-dow);lun.setHours(0,0,0,0);
  const days=Array.from({length:7},(_,i)=>{const d=new Date(lun);d.setDate(lun.getDate()+i);return d;});
  const weekF=fichajes.filter(f=>{const d=new Date(f.ts);return d>=lun&&d<new Date(lun.getTime()+7*86400000);});
  return(<div style={{background:BG2,border:"1px solid #1a4080",borderRadius:10,overflow:"hidden"}}>
    <div style={{padding:"12px 18px",borderBottom:"1px solid #1a4080",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{fontSize:10,fontWeight:700,color:GD,letterSpacing:"1.5px",textTransform:"uppercase"}}>Semana actual</div>
      <div style={{fontSize:12,color:GD}}>{days[0].toLocaleDateString("es-ES",{day:"2-digit",month:"short"})} – {days[6].toLocaleDateString("es-ES",{day:"2-digit",month:"short",year:"numeric"})}</div>
    </div>
    {days.map((d,i)=>{
      const ds=d.toISOString().slice(0,10);const isHoy=ds===hoy.toISOString().slice(0,10);
      const pairs=pairFiches(fichajes.filter(f=>f.ts.startsWith(ds)));const ms=totalMs(pairs);const esFind=i>=5;
      return(<div key={ds} style={{display:"flex",alignItems:"flex-start",padding:"12px 18px",borderBottom:"1px solid rgba(255,255,255,.05)",background:isHoy?"rgba(110,198,255,.07)":"transparent"}}>
        <div style={{minWidth:80,flexShrink:0}}>
          <div style={{fontSize:12,fontWeight:isHoy?700:500,color:isHoy?ACC:esFind?GDD:GR}}>{d.toLocaleDateString("es-ES",{weekday:"short"}).toUpperCase()}</div>
          <div style={{fontSize:11,color:GD}}>{d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"})}</div>
        </div>
        <div style={{flex:1}}>
          {pairs.length===0?<span style={{fontSize:12,color:GDD}}>{esFind?"—":"Sin registros"}</span>:
            pairs.map((p,j)=>{const pMs=p.ent&&p.sal?new Date(p.sal.ts)-new Date(p.ent.ts):0;return(
              <div key={j} style={{display:"flex",alignItems:"center",gap:6,marginBottom:4,fontSize:12,flexWrap:"wrap"}}>
                <span style={{fontFamily:"monospace",fontWeight:600,color:GN}}>{p.ent?fT(p.ent.ts):"—"}</span>
                <span style={{color:GD}}>→</span>
                {p.sal?<span style={{fontFamily:"monospace",fontWeight:600,color:RED}}>{fT(p.sal.ts)}</span>:<span style={{color:GN,animation:"bk 1.5s infinite"}}>●</span>}
                {pMs>0&&<span style={{color:GD,fontSize:11}}>({fMs(pMs)})</span>}
              </div>);})}
        </div>
        {ms>0&&<div style={{flexShrink:0,fontSize:12,fontWeight:600,color:ACC,fontFamily:"monospace",marginLeft:8}}>{fMs(ms)}</div>}
      </div>);})}
    <div style={{padding:"12px 18px",background:CARD,display:"flex",justifyContent:"space-between"}}>
      <div style={{fontSize:12,color:GD}}>Total semana</div>
      <div style={{fontSize:13,fontWeight:700,color:ACC,fontFamily:"monospace"}}>{fMs(totalMs(pairFiches(weekF)))}</div>
    </div>
  </div>);
}

// ── CONFIGURACIÓN ONEDRIVE ────────────────────────────────────
function ConfigTab({user,onUserUpdate}){
  const[od,setOd]=useState({connected:false,backup_time:"23:00"});
  const[f,setF]=useState({nombre:user.nombre,apellido:user.apellido,email:user.email||"",phone:user.phone||"",dept:user.dept||""});
  const[msg,setMsg]=useState(null);const[ld,setLd]=useState(false);const[ldB,setLdB]=useState("");
  const set=k=>e=>setF(x=>({...x,[k]:e.target.value}));

  useEffect(()=>{
    api("/api/onedrive/status").then(setOd).catch(()=>{});
    // Detectar retorno de OAuth
    const p=new URLSearchParams(window.location.search);
    if(p.get("onedrive")==="success"){setMsg({t:"ok",m:"✅ OneDrive conectado correctamente"});window.history.replaceState({},"","/");}
    if(p.get("onedrive")==="error"){setMsg({t:"e",m:"❌ Error al conectar OneDrive. Inténtalo de nuevo."});window.history.replaceState({},"","/");}
  },[]);

  async function saveProfile(){
    setLd(true);setMsg(null);
    try{
      await api("/api/profile",{method:"PUT",body:JSON.stringify({...f,backup_time:od.backup_time})});
      setMsg({t:"ok",m:"✅ Perfil actualizado correctamente"});
      if(onUserUpdate)onUserUpdate({...user,...f});
    }catch(e){setMsg({t:"e",m:e.message});}finally{setLd(false);}
  }

  async function disconnect(){
    if(!window.confirm("¿Desconectar OneDrive?"))return;
    try{await api("/api/auth/onedrive/disconnect",{method:"POST"});setOd(x=>({...x,connected:false}));setMsg({t:"ok",m:"OneDrive desconectado"});}
    catch(e){setMsg({t:"e",m:e.message});}
  }

  async function doBackup(tipo){
    setLdB(tipo);setMsg(null);
    try{
      const r=await api(`/api/backup/${tipo}`,{method:"POST"});
      setMsg({t:"ok",m:`✅ Backup completado → ${r.file}`});
    }catch(e){setMsg({t:"e",m:e.message});}finally{setLdB("");}
  }

  const I=(k,l,t,ac)=>(<div style={{marginBottom:12}}><label style={{display:"block",fontSize:12,color:GD,marginBottom:4}}>{l}</label><input type={t||"text"} value={f[k]} placeholder={l} autoCapitalize={ac||"words"} onChange={set(k)} style={INP}/></div>);

  return(<>
    <div style={{background:BG2,border:"1px solid #1a4080",borderRadius:10,padding:18,marginBottom:14}}>
      <div style={{fontSize:10,fontWeight:700,color:GD,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:14}}>Datos personales</div>
      <Msg t={msg?.t} m={msg?.m}/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{I("nombre","Nombre")}{I("apellido","Apellido")}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{I("email","Email","email","none")}{I("phone","Teléfono","tel","none")}</div>
      {I("dept","Departamento")}
      <button disabled={ld} onClick={saveProfile} style={{...bB,background:BLUE,color:"#fff",opacity:ld?.6:1}}>{ld?<Sp/>:"Guardar cambios"}</button>
    </div>

    <div style={{background:BG2,border:"1px solid #1a4080",borderRadius:10,padding:18,marginBottom:14}}>
      <div style={{fontSize:10,fontWeight:700,color:GD,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:14}}>OneDrive — Copias de seguridad</div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,padding:"12px 14px",background:CARD,borderRadius:8,border:"1px solid "+(od.connected?"rgba(44,182,125,.3)":"#1a4080")}}>
        <span style={{fontSize:20}}>{od.connected?"✅":"🔌"}</span>
        <div style={{flex:1}}>
          <div style={{fontSize:13,fontWeight:600,color:od.connected?GN:GR}}>{od.connected?"OneDrive conectado":"OneDrive no conectado"}</div>
          <div style={{fontSize:11,color:GD}}>{od.connected?"Las copias se guardan automáticamente":"Conecta tu cuenta para activar los backups"}</div>
        </div>
        {od.connected?
          <button onClick={disconnect} style={{...bB,background:"transparent",color:RED,border:"1px solid rgba(224,57,70,.3)",fontSize:11,padding:"5px 12px"}}>Desconectar</button>:
          <button onClick={()=>window.location.href=`${BASE}/api/auth/onedrive/connect?token=${getToken()}`} style={{...bB,background:BLUE,color:"#fff",fontSize:12,padding:"8px 16px"}}>🔗 Conectar OneDrive</button>
        }
      </div>

      {od.connected&&(<>
        <div style={{marginBottom:14}}>
          <label style={{display:"block",fontSize:12,color:GD,marginBottom:6}}>Hora del backup diario automático</label>
          <input type="time" value={od.backup_time} onChange={e=>setOd(x=>({...x,backup_time:e.target.value}))} style={{...INP,width:"auto"}}/>
        </div>

        <div style={{fontSize:10,fontWeight:700,color:GD,letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:10}}>Backup manual</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8}}>
          {[["daily","📅 Hoy","Fichajes de hoy"],["monthly","📆 Este mes","Fichajes del mes"],["annual","📋 Este año","Fichajes del año"],["full","💾 Completo","Todos los datos"]].map(([tipo,label,desc])=>(
            <button key={tipo} disabled={ldB===tipo} onClick={()=>doBackup(tipo)} style={{...bB,background:CARD,color:GR,border:"1px solid #1a4080",flexDirection:"column",gap:4,padding:"12px 8px",fontSize:12,opacity:ldB===tipo?.6:1}}>
              {ldB===tipo?<Sp sz={16}/>:<span style={{fontSize:18}}>{label.split(" ")[0]}</span>}
              <span style={{fontWeight:600}}>{label.split(" ").slice(1).join(" ")}</span>
              <span style={{fontSize:10,color:GD,fontWeight:400}}>{desc}</span>
            </button>
          ))}
        </div>

        <div style={{marginTop:12,fontSize:11,color:GD,background:CARD,padding:"10px 14px",borderRadius:8}}>
          📁 Los archivos se guardan en <b style={{color:ACC}}>OneDrive / DRT-Fichaje / Diario|Mensual|Anual</b>
        </div>
      </>)}
    </div>
  </>);
}

function Dashboard({empleados,allFichajes,now}){
  const lastF=id=>{const a=allFichajes.filter(f=>f.uid===id);return a.length?a[a.length-1]:null;};
  const activos=empleados.filter(u=>u.active&&!u.deleted);
  const enJornada=activos.filter(u=>{const lf=lastF(u.id);return lf&&lf.tipo==="entrada";});
  const alertas=enJornada.filter(u=>{const lf=lastF(u.id);return lf&&hAgo(lf.ts,8);});
  const hoy=new Date();const dow=(hoy.getDay()+6)%7;
  const lun=new Date(hoy);lun.setDate(hoy.getDate()-dow);lun.setHours(0,0,0,0);
  const finSem=new Date(lun.getTime()+7*86400000);
  return(<>
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:16}}>
      {[{l:"En jornada",v:enJornada.length,c:GN,i:"🟢"},{l:"Fuera",v:activos.length-enJornada.length,c:GD,i:"⚫"},{l:"Alertas +8h",v:alertas.length,c:alertas.length>0?WARN:GD,i:"⚠️"}].map(({l,v,c,i})=>(
        <div key={l} style={{background:BG2,border:"1px solid #1a4080",borderRadius:10,padding:16,textAlign:"center"}}>
          <div style={{fontSize:24,marginBottom:4}}>{i}</div><div style={{fontSize:28,fontWeight:700,color:c}}>{v}</div>
          <div style={{fontSize:11,color:GD,marginTop:2}}>{l}</div>
        </div>))}
    </div>
    {alertas.length>0&&<div style={{background:"rgba(245,158,11,.1)",border:"1px solid rgba(245,158,11,.3)",borderRadius:10,padding:16,marginBottom:16}}>
      <div style={{fontSize:12,fontWeight:700,color:WARN,marginBottom:10}}>⚠️ Más de 8h sin fichar salida</div>
      {alertas.map(u=>{const lf=lastF(u.id);const h=Math.floor((Date.now()-new Date(lf.ts).getTime())/3600000);return(<div key={u.id} style={{fontSize:12,color:GR,marginBottom:4}}>• {u.fullname} — <b style={{color:WARN}}>{h}h</b> desde {fT(lf.ts)}</div>);})}
    </div>}
    <div style={{background:BG2,border:"1px solid #1a4080",borderRadius:10,overflow:"hidden",marginBottom:16}}>
      <div style={{padding:"12px 16px",borderBottom:"1px solid #1a4080",fontSize:10,fontWeight:700,color:GD,letterSpacing:"1.5px",textTransform:"uppercase"}}>Estado en tiempo real · {fTs(now)}</div>
      {activos.map(u=>{const lf=lastF(u.id);const inside=lf&&lf.tipo==="entrada";const al=inside&&lf&&hAgo(lf.ts,8);return(
        <div key={u.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
          <div style={{fontWeight:600,fontSize:13}}>{u.fullname}<span style={{fontSize:11,color:GD,marginLeft:8,fontWeight:400}}>{u.dept}</span></div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            {al&&<span style={{fontSize:11,color:WARN}}>⚠️</span>}
            <span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 10px",borderRadius:100,fontSize:11,fontWeight:600,textTransform:"uppercase",background:inside?"rgba(44,182,125,.15)":"rgba(255,255,255,.08)",color:inside?GN:GD,border:"1px solid "+(inside?"rgba(44,182,125,.3)":"#1a4080")}}>
              <span style={{width:6,height:6,borderRadius:"50%",background:"currentColor",animation:inside?"bk 1.5s infinite":"none"}}/>{inside?"EN JORNADA":"FUERA"}
            </span>
          </div>
        </div>);})}
    </div>
    <div style={{background:BG2,border:"1px solid #1a4080",borderRadius:10,overflow:"hidden"}}>
      <div style={{padding:"12px 16px",borderBottom:"1px solid #1a4080",fontSize:10,fontWeight:700,color:GD,letterSpacing:"1.5px",textTransform:"uppercase"}}>Horas esta semana</div>
      {activos.map(u=>{const wf=allFichajes.filter(f=>f.uid===u.id&&new Date(f.ts)>=lun&&new Date(f.ts)<finSem);const ms=totalMs(pairFiches(wf));return(
        <div key={u.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
          <div style={{fontSize:13,color:GR}}>{u.fullname}</div>
          <div style={{fontSize:13,fontWeight:600,color:ms>0?ACC:GDD,fontFamily:"monospace"}}>{fMs(ms)}</div>
        </div>);})}
    </div>
  </>);
}

function EmpleadosAdmin({empleados,allFichajes,onRefresh}){

  async function resetPwd(){if(newPwd.length<6)return setPwdMsg("e");setLd(true);
    try{await api("/api/admin/reset-pwd",{method:"POST",body:JSON.stringify({user_id:sel.id,new_pwd:newPwd})});setPwdMsg("ok");setNewPwd("");}
    catch(e){alert(e.message);}finally{setLd(false);}
  }
  async function deleteUser(u){

    try{await api(`/api/admin/empleados/${u.id}`,{method:"DELETE"});onRefresh();setSel(null);}catch(e){alert(e.message);}

  function sendEmail(u){const sub=encodeURIComponent("DRT Fichaje — Tu acceso");const body=encodeURIComponent(`Hola ${u.fullname},\n\nAccede al sistema con:\nNombre: ${u.fullname}\nContraseña temporal: (la que te ha comunicado el administrador)\n\nDurango Rugby Taldea`);window.open(`mailto:${u.email||""}?subject=${sub}&body=${body}`,"_blank");}
  return(<>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <div style={{fontSize:13,color:GR}}><b>{activos.length}</b> cuentas activas</div>

    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(185px,1fr))",gap:10,marginBottom:16}}>
      {activos.map(u=>{const lf=lastF(u.id);const inside=lf&&lf.tipo==="entrada";return(
        <div key={u.id} onClick={()=>{setSel(sel?.id===u.id?null:u);setPwdMsg("");setNewPwd("");}} style={{background:CARD,border:"1px solid "+(sel?.id===u.id?ACC:"#1a4080"),borderRadius:9,padding:14,cursor:"pointer"}}>
          <div style={{fontSize:13,fontWeight:700,marginBottom:2}}>{u.fullname}</div>
          <div style={{fontSize:11,color:GD,marginBottom:10}}>{u.dept||u.role}</div>

            <span style={{width:7,height:7,borderRadius:"50%",background:"currentColor",animation:inside?"bk 1.5s infinite":"none"}}/>{inside?"EN JORNADA":"FUERA"}
          </span>
          {!u.active&&<div style={{fontSize:10,color:RED,marginTop:6}}>● INACTIVO</div>}
          {u.firstLogin&&<div style={{fontSize:10,color:WARN,marginTop:4}}>⏳ Pendiente primer acceso</div>}
        </div>);})}
    </div>
    {sel&&<div style={{background:BG2,border:"1px solid #1a4080",borderRadius:10,padding:18,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>

function NuevoEmp({onClose}){
  const[f,setF]=useState({nombre:"",apellido:"",pwd:"",email:"",phone:"",dept:"",role:"employee"});
  const[err,setErr]=useState("");const[ld,setLd]=useState(false);
  const set=k=>e=>setF(x=>({...x,[k]:e.target.value}));
  async function create(){
    if(!f.nombre.trim()||!f.apellido.trim()||!f.pwd)return setErr("Nombre, apellido y contraseña obligatorios");
    if(f.pwd.length<6)return setErr("Contraseña mínimo 6 caracteres");
    setLd(true);
    try{await api("/api/admin/empleados",{method:"POST",body:JSON.stringify({nombre:f.nombre.trim(),apellido:f.apellido.trim(),email:f.email,phone:f.phone,dept:f.dept,role:f.role,temp_pwd:f.pwd})});onClose();}
    catch(e){setErr(e.message);}finally{setLd(false);}
  }
  const I=(k,l,t,ac)=>(<div style={{marginBottom:12}}><label style={{display:"block",fontSize:12,color:GD,marginBottom:4}}>{l}</label><input type={t||"text"} value={f[k]} placeholder={l} autoCapitalize={ac||"words"} onChange={set(k)} style={INP}/></div>);
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",zIndex:200,display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"24px 16px",overflowY:"auto"}}>

      <div style={{fontSize:16,fontWeight:700,marginBottom:14}}>➕ Nueva ficha de empleado</div>
      <Msg t="e" m={err}/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{I("nombre","Nombre *")}{I("apellido","Apellido *")}</div>
      {I("pwd","Contraseña temporal *","password","none")}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>{I("email","Email","email","none")}{I("phone","Teléfono","tel","none")}{I("dept","Departamento")}</div>
      <div style={{marginBottom:12}}><label style={{display:"block",fontSize:12,color:GD,marginBottom:4}}>Rol</label>
        <select value={f.role} onChange={set("role")} style={INP}><option value="employee">Empleado</option><option value="admin">Administrador</option></select></div>
      <Msg t="i" m="El empleado creará su contraseña personal en el primer acceso."/>
      <div style={{display:"flex",gap:8,marginTop:8}}>
        <button onClick={onClose} style={{...bB,flex:1,background:"transparent",color:GR,border:"1px solid #1a4080"}}>Cancelar</button>
        <button disabled={ld} onClick={create} style={{...bB,flex:2,background:BLUE,color:"#fff",opacity:ld?.6:1}}>{ld?<Sp/>:"Crear empleado"}</button>
      </div>
    </div>
  </div>);
}

function FichajesAdmin({allFichajes,empleados,onRefresh}){
  const uMap=Object.fromEntries(empleados.map(u=>[u.id,u.fullname]));
  async function del(id){if(!window.confirm("¿Eliminar este fichaje?"))return;try{await api(`/api/admin/fichajes/${id}`,{method:"DELETE"});onRefresh();}catch(e){alert(e.message);}}
  return(<><Msg t="i" m={`🔒 Retención mínima ${RET} años.`}/>
    <div style={{overflowX:"auto",borderRadius:10,border:"1px solid #1a4080"}}>
      <table><thead><tr><th>Empleado</th><th>Tipo</th><th>Fecha</th><th>Hora</th><th>IP</th><th>GPS</th><th></th></tr></thead>
      <tbody>{[...allFichajes].reverse().map(f=>(<tr key={f.id}>
        <td style={{color:"#fff"}}>{uMap[f.uid]||f.uid}</td>
        <td><span style={{padding:"3px 9px",borderRadius:100,fontSize:10,fontWeight:600,textTransform:"uppercase",background:f.tipo==="entrada"?"rgba(44,182,125,.15)":"rgba(230,57,70,.15)",color:f.tipo==="entrada"?GN:RED}}>{f.tipo}</span></td>
        <td>{fDate(f.ts)}</td><td>{fTs(f.ts)}</td><td>{f.ip}</td>
        <td>{f.lat!=null?`${f.lat.toFixed(3)},${f.lon.toFixed(3)}`:"N/D"}</td>
        <td>{canDel(f.ts)&&<button onClick={()=>del(f.id)} style={{...bB,background:RED,color:"#fff",fontSize:10,padding:"3px 8px"}}>Eliminar</button>}</td>
      </tr>))}{allFichajes.length===0&&<tr><td colSpan={7} style={{textAlign:"center",padding:16,color:GDD}}>Sin registros</td></tr>}</tbody></table>
    </div>
  </>);
}

function ExportarAdmin(){
  const[ld,setLd]=useState(false);const[msg,setMsg]=useState("");
  async function exportar(){setLd(true);
    try{const r=await api("/api/admin/export");
      const wb=XLSX.utils.book_new();const uMap=Object.fromEntries(r.users.map(u=>[u.id,u.fullname]));
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.fichajes.map(f=>({Empleado:uMap[f.uid]||"",Tipo:f.tipo,Fecha:fDate(f.ts),Hora:fTs(f.ts),IP:f.ip,Lat:f.lat||"",Lon:f.lon||""}))), "Fichajes");
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.users.map(u=>({Nombre:u.nombre,Apellido:u.apellido,Email:u.email||"",Telefono:u.phone||"",Dept:u.dept||"",Rol:u.role,Alta:fDate(u.createdAt)}))), "Empleados");
      XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.audit.map(a=>({Evento:a.type,Fecha:fDT(a.ts),Detalle:a.details||""}))), "Auditoría");
      XLSX.writeFile(wb,"DRT-"+new Date().toISOString().slice(0,10)+".xlsx");setMsg("✅ Archivo descargado correctamente.");}
    catch(e){setMsg("Error: "+e.message);}finally{setLd(false);}
  }
  return(<><Msg t="i" m="📊 Exportación .xlsx — 3 hojas: Fichajes, Empleados, Auditoría."/>
    {msg&&<Msg t={msg.startsWith("Error")?"e":"ok"} m={msg}/>}
    <div style={{display:"flex",justifyContent:"center",margin:"24px 0"}}>
      <button disabled={ld} onClick={exportar} style={{...bB,background:GN,color:"#fff",fontSize:16,padding:"16px 40px",borderRadius:12,opacity:ld?.6:1}}>{ld?<Sp sz={22}/>:"📊 Exportar a Excel (.xlsx)"}</button>
    </div>
  </>);
}

function AuditoriaAdmin({auditoria}){
  const ico={FICHAJE:"📍",SETUP:"🔧",CREATE_USER:"👤",PWD_RESET:"🔐",FIRST_PWD:"🆕",EXPORT:"📊",LOGIN:"🔑",LOGOUT:"🚪",BACKUP:"💾",BACKUP_AUTO:"🔄",ONEDRIVE_CONNECT:"🔗",ONEDRIVE_DISCONNECT:"🔌",DELETE_USER:"🗑",UPDATE_PROFILE:"✏️"};
  return(<div style={{overflowX:"auto",borderRadius:10,border:"1px solid #1a4080"}}>
    <table><thead><tr><th>Evento</th><th>Fecha / Hora</th><th>Detalle</th></tr></thead>
    <tbody>{auditoria.map(a=>(<tr key={a.id}><td style={{color:"#fff",whiteSpace:"nowrap"}}>{(ico[a.type]||"📌")+" "+a.type}</td><td>{fDT(a.ts)}</td><td>{a.details||"—"}</td></tr>))}{auditoria.length===0&&<tr><td colSpan={3} style={{textAlign:"center",padding:14,color:GDD}}>Sin eventos</td></tr>}</tbody></table>
  </div>);
}

function AdminApp({user,now,onLogout,onEmp,onUserUpdate}){
  const[tab,setTab]=useState("d");
  const[empleados,setEmpleados]=useState([]);const[allFichajes,setAllFichajes]=useState([]);const[auditoria,setAuditoria]=useState([]);
  const load=useCallback(async()=>{try{const[e,f]=await Promise.all([api("/api/admin/empleados"),api("/api/admin/fichajes")]);setEmpleados(e);setAllFichajes(f);}catch{}},[]);
  useEffect(()=>{load();},[]);
  useEffect(()=>{if(tab==="a")api("/api/admin/auditoria").then(setAuditoria).catch(()=>{});},[tab]);

  useEffect(()=>{
    const p=new URLSearchParams(window.location.search);
    if(p.get("onedrive"))setTab("cfg");
  },[]);

  return(<div><Hdr user={user} onLogout={onLogout} onAdmin={null}/>
    <Tabs tabs={[["d","📊 Dashboard"],["e","👥 Empleados"],["f","📋 Fichajes"],["x","📊 Exportar"],["a","🔍 Auditoría"],["cfg","⚙️ Configuración"]]} cur={tab} set={setTab}/>
    <div style={{display:"flex",justifyContent:"flex-end",padding:"6px 16px",background:BG2,borderBottom:"1px solid #1a4080"}}>
      <button onClick={onEmp} style={{...bB,background:"transparent",color:GD,border:"1px solid #1a4080",fontSize:11,padding:"4px 12px"}}>← Mi fichaje personal</button>
    </div>
    <div style={{maxWidth:880,margin:"0 auto",padding:"20px 14px 60px"}}>
      {tab==="d"&&<Dashboard empleados={empleados} allFichajes={allFichajes} now={now}/>}
      {tab==="e"&&<EmpleadosAdmin empleados={empleados} allFichajes={allFichajes} onRefresh={load}/>}
      {tab==="f"&&<FichajesAdmin allFichajes={allFichajes} empleados={empleados} onRefresh={load}/>}
      {tab==="x"&&<ExportarAdmin/>}
      {tab==="a"&&<AuditoriaAdmin auditoria={auditoria}/>}
      {tab==="cfg"&&<ConfigTab user={user} onUserUpdate={onUserUpdate}/>}
    </div>
  </div>);
}

// ── APP PRINCIPAL ─────────────────────────────────────────────
function App(){
  const[sc,setSc]=useState("loading");const[user,setUser]=useState(null);
  const[loginErr,setLoginErr]=useState("");const[loginLd,setLoginLd]=useState(false);
  const[now,setNow]=useState(new Date());

  useEffect(()=>{
    const clock=setInterval(()=>setNow(new Date()),1000);
    (async()=>{
      try{const r=await api("/api/status");
        if(!r.configured){setSc("setup");return;}
        const tk=getToken();
        if(tk){try{const me=await api("/api/me");setUser(me);setSc(me.role==="admin"?"admin":"employee");return;}catch{clearToken();}}
        setSc("login");
      }catch{setSc("login");}
    })();
    return()=>clearInterval(clock);
  },[]);

  async function login(name,pwd){
    setLoginErr("");setLoginLd(true);
    try{const r=await api("/api/auth/login",{method:"POST",body:JSON.stringify({nombre:name,password:pwd})});
      setToken(r.token);setUser(r.user);setSc(r.user.firstLogin?"firstpwd":(r.user.role==="admin"?"admin":"employee"));}
    catch(e){setLoginErr(e.message);}finally{setLoginLd(false);}
  }

  function logout(){clearToken();setUser(null);setSc("login");setLoginErr("");}
  function updateUser(newData){setUser(u=>({...u,...newData}));}

  const isA=user?.role==="admin";
  return(<>
    {sc==="loading"&&<div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:20}}><Logo h="18vh"/><Sp sz={30}/><div style={{fontSize:13,color:GD}}>Cargando…</div></div>}
    {sc==="setup"&&<Setup onDone={u=>{setUser(u);setSc("admin");}}/>}
    {sc==="login"&&<Login onLogin={login} err={loginErr} ld={loginLd}/>}
    {sc==="firstpwd"&&user&&<FirstPwd user={user} onDone={()=>setSc(user.role==="admin"?"admin":"employee")}/>}
    {sc==="employee"&&user&&<EmpApp user={user} now={now} onLogout={logout} onAdmin={isA?()=>setSc("admin"):null} onUserUpdate={updateUser}/>}
    {sc==="admin"&&user&&<AdminApp user={user} now={now} onLogout={logout} onEmp={()=>setSc("employee")} onUserUpdate={updateUser}/>}
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
